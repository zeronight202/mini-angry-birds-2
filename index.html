<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angry Birds</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #222;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background: #70c5ce;
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let gameState = "MENU"; 
let score = 0;
let scale = 1;
let groundY = 0;

let sling = { x: 0, y: 0, radius: 15 };
let bird = { x: 0, y: 0, radius: 15, vx: 0, vy: 0, isDragging: false, isLaunched: false };
let targets = [];
let buttonRect = { x: 0, y: 0, w: 200, h: 50 };

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    let scaleX = canvas.width / 1200;
    let scaleY = canvas.height / 600;
    scale = Math.min(scaleX, scaleY);
    if (scale < 0.5) scale = 0.5;

    groundY = canvas.height - (80 * scale);
    sling = { x: 200 * scale, y: groundY - (120 * scale), radius: 18 * scale };
    
    if (!bird.isLaunched) {
        bird.x = sling.x;
        bird.y = sling.y;
        bird.radius = 18 * scale;
    }

    buttonRect.w = 220 * scale;
    buttonRect.h = 55 * scale;
    buttonRect.x = (canvas.width - buttonRect.w) / 2;
    buttonRect.y = (canvas.height / 2) + (50 * scale);

    const startX = canvas.width - (350 * scale);
    const boxW = 55 * scale;
    const boxH = 65 * scale;
    targets = [
        { x: startX, y: groundY - boxH, width: boxW, height: boxH, alive: true },
        { x: startX + boxW + (15 * scale), y: groundY - boxH, width: boxW, height: boxH, alive: true },
        { x: startX + (boxW / 2) + (7 * scale), y: groundY - (boxH * 2) - (5 * scale), width: boxW, height: boxH, alive: true }
    ];
}

function getMousePos(e) {
    let clientX = e.clientX;
    let clientY = e.clientY;
    if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
    } else if (e.changedTouches && e.changedTouches.length > 0) {
        clientX = e.changedTouches[0].clientX;
        clientY = e.changedTouches[0].clientY;
    }
    return { x: clientX, y: clientY };
}

function handleStart(e) {
    let pos = getMousePos(e);
    if (gameState === "MENU" || gameState === "GAMEOVER") {
        if (pos.x >= buttonRect.x && pos.x <= buttonRect.x + buttonRect.w &&
            pos.y >= buttonRect.y && pos.y <= buttonRect.y + buttonRect.h) {
            score = 0;
            gameState = "PLAYING";
            bird.isLaunched = false;
            resize();
        }
    } else if (gameState === "PLAYING" && !bird.isLaunched) {
        let dist = Math.hypot(pos.x - bird.x, pos.y - bird.y);
        if (dist < bird.radius + (35 * scale)) {
            bird.isDragging = true;
        }
    }
}

function handleMove(e) {
    if (gameState !== "PLAYING" || !bird.isDragging) return;
    let pos = getMousePos(e);
    let distX = pos.x - sling.x;
    let distY = pos.y - sling.y;
    let angle = Math.atan2(distY, distX);
    let dist = Math.min(Math.hypot(distX, distY), 120 * scale);
    bird.x = sling.x + Math.cos(angle) * dist;
    bird.y = sling.y + Math.sin(angle) * dist;
}

function handleEnd() {
    if (gameState !== "PLAYING" || !bird.isDragging) return;
    bird.isDragging = false;
    bird.isLaunched = true;
    bird.vx = (sling.x - bird.x) * 0.15;
    bird.vy = (sling.y - bird.y) * 0.15;
}

window.addEventListener("mousedown", handleStart);
window.addEventListener("mousemove", handleMove);
window.addEventListener("mouseup", handleEnd);

window.addEventListener("touchstart", function(e) { handleStart(e); }, { passive: false });
window.addEventListener("touchmove", function(e) { handleMove(e); }, { passive: false });
window.addEventListener("touchend", handleEnd);

window.addEventListener("resize", resize);

function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#654321";
    ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

    ctx.strokeStyle = "#4a2c11";
    ctx.lineWidth = 8 * scale;
    ctx.beginPath();
    ctx.moveTo(sling.x, sling.y);
    ctx.lineTo(sling.x, groundY);
    ctx.stroke();

    if (gameState === "MENU") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#ff3333";
        ctx.font = "bold " + Math.floor(54 * scale) + "px Arial";
        ctx.textAlign = "center";
        ctx.fillText("ANGRY BIRDS MINI", canvas.width / 2, canvas.height / 3);

        ctx.fillStyle = "#ccc";
        ctx.font = Math.floor(20 * scale) + "px Arial";
        ctx.fillText("Kéo và thả chú chim màu đỏ để phá hủy các khối hộp!", canvas.width / 2, canvas.height / 2);

        ctx.fillStyle = "#8ddb44";
        ctx.beginPath();
        ctx.roundRect(buttonRect.x, buttonRect.y, buttonRect.w, buttonRect.h, 25 * scale);
        ctx.fill();

        ctx.fillStyle = "#222";
        ctx.font = "bold " + Math.floor(22 * scale) + "px Arial";
        ctx.fillText("CHƠI NGAY", canvas.width / 2, buttonRect.y + (buttonRect.h / 2) + (7 * scale));
    } else if (gameState === "GAMEOVER") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#8ddb44";
        ctx.font = "bold " + Math.floor(54 * scale) + "px Arial";
        ctx.textAlign = "center";
        ctx.fillText("CHIẾN THẮNG!", canvas.width / 2, canvas.height / 3);

        ctx.fillStyle = "#fff";
        ctx.font = Math.floor(24 * scale) + "px Arial";
        ctx.fillText("Tổng số điểm của bạn: " + score, canvas.width / 2, canvas.height / 2);

        ctx.fillStyle = "#8ddb44";
        ctx.beginPath();
        ctx.roundRect(buttonRect.x, buttonRect.y, buttonRect.w, buttonRect.h, 25 * scale);
        ctx.fill();

        ctx.fillStyle = "#222";
        ctx.font = "bold " + Math.floor(22 * scale) + "px Arial";
        ctx.fillText("CHƠI LẠI", canvas.width / 2, buttonRect.y + (buttonRect.h / 2) + (7 * scale));
    } else if (gameState === "PLAYING") {
        ctx.fillStyle = "#fff";
        ctx.font = "bold 28px Arial";
        ctx.textAlign = "center";
        ctx.fillText("Điểm: " + score, canvas.width / 2, 40);

        if (bird.isDragging) {
            ctx.strokeStyle = "#4a2c11";
            ctx.lineWidth = 5 * scale;
            ctx.beginPath();
            ctx.moveTo(sling.x, sling.y);
            ctx.lineTo(bird.x, bird.y);
            ctx.stroke();
        }

        if (bird.isLaunched) {
            bird.x += bird.vx;
            bird.y += bird.vy;
            bird.vy += 0.25;

            if (bird.y + bird.radius >= groundY || bird.x > canvas.width || bird.x < 0) {
                bird.x = sling.x;
                bird.y = sling.y;
                bird.vx = 0;
                bird.vy = 0;
                bird.isLaunched = false;
            }
        }

        ctx.fillStyle = "#ff3333";
        ctx.beginPath();
        ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
        ctx.fill();

        let allDead = true;
        targets.forEach(t => {
            if (t.alive) {
                allDead = false;
                
                let closestX = Math.max(t.x, Math.min(bird.x, t.x + t.width));
                let closestY = Math.max(t.y, Math.min(bird.y, t.y + t.height));
                let distance = Math.hypot(bird.x - closestX, bird.y - closestY);
                
                if (distance < bird.radius) {
                    t.alive = false;
                    score += 100;
                }
                
                ctx.fillStyle = "#8ddb44";
                ctx.fillRect(t.x, t.y, t.width, t.height);
                ctx.strokeStyle = "#558822";
                ctx.lineWidth = 2 * scale;
                ctx.strokeRect(t.x, t.y, t.width, t.height);
            }
        });

        if (allDead) {
            gameState = "GAMEOVER";
            resize();
        }
    }

    requestAnimationFrame(update);
}

resize();
update();
</script>
</body>
</html>
