<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angry Birds Full Screen Fix</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            color: white;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #70c5ce;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(24px, 4vw, 36px);
            font-weight: bold;
            pointer-events: none;
            z-index: 5;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
            text-align: center;
        }
        .overlay h1 {
            font-size: clamp(36px, 6vw, 64px);
            margin-bottom: 20px;
            color: #ff3333;
            text-shadow: 2px 2px 8px black;
            letter-spacing: 2px;
        }
        .overlay p {
            font-size: clamp(16px, 2.5vw, 24px);
            margin-bottom: 40px;
            max-width: 600px;
            line-height: 1.5;
        }
        .btn {
            padding: 15px 45px;
            font-size: clamp(18px, 2vw, 26px);
            font-weight: bold;
            background: #8ddb44;
            color: #222;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 6px 0 #558822;
            transition: 0.1s;
        }
        .btn:hover {
            background: #a2e85c;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #558822;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div id="ui" class="hidden">Điểm: <span id="score">0</span></div>

        <!-- MENU BẮT ĐẦU -->
        <div id="startScreen" class="overlay">
            <h1>ANGRY BIRDS MINI</h1>
            <p>Kéo và thả chú chim màu đỏ để phá hủy các khối hộp!</p>
            <button class="btn" onclick="startGame()">CHƠI NGAY</button>
        </div>

        <!-- MÀN HÌNH KẾT THÚC -->
        <div id="gameOverScreen" class="overlay hidden">
            <h1 id="gameOverTitle">CHIẾN THẮNG!</h1>
            <p>Tổng số điểm của bạn: <span id="finalScore">0</span></p>
            <button class="btn" onclick="restartGame()">CHƠI LẠI</button>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const ui = document.getElementById("ui");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOverScreen");
const gameOverTitle = document.getElementById("gameOverTitle");
const finalScoreEl = document.getElementById("finalScore");

let gameState = "MENU"; 
let score = 0;

// Hệ thống tỷ lệ hiển thị
const BASE_WIDTH = 1200;
const BASE_HEIGHT = 600;
let scale = 1;

let groundY;
let sling;
let bird;
let targets = [];

// Hàm thiết lập chuẩn kích cỡ màn hình
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    // Tính toán tỷ lệ dựa trên cả chiều rộng và chiều cao để không bị mất vật thể
    const scaleX = canvas.width / BASE_WIDTH;
    const scaleY = canvas.height / BASE_HEIGHT;
    scale = Math.min(scaleX, scaleY);
    if (scale < 0.5) scale = 0.5; // Giới hạn không cho thu quá nhỏ

    groundY = canvas.height - (80 * scale);
    sling = { x: 200 * scale, y: groundY - (120 * scale), radius: 18 * scale };
    
    if (!bird || !bird.isLaunched) {
        resetBird();
    } else {
        bird.radius = 18 * scale;
    }
}

function resetBird() {
    bird = {
        x: sling.x,
        y: sling.y,
        radius: 18 * scale,
        vx: 0,
        vy: 0,
        isDragging: false,
        isLaunched: false
    };
}

function initTargets() {
    const startX = canvas.width - (350 * scale);
    const boxW = 50 * scale;
    const boxH = 60 * scale;
    
    // Khởi tạo các khối hộp xếp chồng lên nhau hình kim tự tháp
    targets = [
        { x: startX, y: groundY - boxH, width: boxW, height: boxH, alive: true },
        { x: startX + boxW + (15 * scale), y: groundY - boxH, width: boxW, height: boxH, alive: true },
        { x: startX + (boxW / 2) + (7 * scale), y: groundY - (boxH * 2) - (5 * scale), width: boxW, height: boxH, alive: true }
    ];
}

function startGame() {
    gameState = "PLAYING";
    score = 0;
    scoreEl.textContent = score;
    
    // Cập nhật kích thước trước khi xếp mục tiêu
    resizeCanvas();
    initTargets();
    resetBird();
    
    startScreen.classList.add("hidden");
    gameOverScreen.classList.add("hidden");
    ui.classList.remove("hidden");
}

function endGame(isWin) {
    gameState = "GAMEOVER";
    ui.classList.add("hidden");
    gameOverScreen.classList.remove("hidden");
    finalScoreEl.textContent = score;
    
    if (isWin) {
        gameOverTitle.textContent = "CHIẾN THẮNG!";
        gameOverTitle.style.color = "#8ddb44";
    } else {
        gameOverTitle.textContent = "GAME OVER";
        gameOverTitle.style.color = "#ff3333";
    }
}

function restartGame() {
    startGame();
}

// Xử lý kéo thả chuột và cảm ứng cảm ứng tốt hơn
function getMousePos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    const clientY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
    return {
        x: clientX - rect.left,
        y: clientY - rect.top
    };
}

function startDrag(e) {
    if (gameState !== "PLAYING" || bird.isLaunched) return;
    const pos = getMousePos(e);
    const dist = Math.hypot(pos.x - bird.x, pos.y - bird.y);
    if (dist < bird.radius + (30 * scale)) { // Tăng vùng chạm để dễ kéo hơn trên điện thoại
        bird.isDragging = true;
    }
}

function drag(e) {
    if (!bird.isDragging || gameState !== "PLAYING") return;
    const pos = getMousePos(e);
    
    const distX = pos.x - sling.x;
    const distY = pos.y - sling.y;
    const angle = Math.atan2(distY, distX);
    const dist = Math.min(Math.hypot(distX, distY), 120 * scale);

    bird.x = sling.x + Math.cos(angle) * dist;
    bird.y = sling.y + Math.sin(angle) * dist;
}

function endDrag() {
    if (!bird.isDragging || gameState !== "PLAYING") return;
    bird.isDragging = false;
    bird.isLaunched = true;

    bird.vx = (sling.x - bird.x) * 0.15;
    bird.vy = (sling.y - bird.y) * 0.15;
}

canvas.addEventListener("mousedown", startDrag);
canvas.addEventListener("mousemove", drag);
window.addEventListener("mouseup", endDrag);

canvas.addEventListener("touchstart", startDrag, { passive: true });
canvas.addEventListener("touchmove", drag, { passive: true });
window.addEventListener("touchend", endDrag);

window.addEventListener("resize", () => {
    resizeCanvas();
    if (gameState === "PLAYING") {
        initTargets();
    }
});

function checkCollision(b, t) {
    if (!t.alive) return false;
    let closestX = Math.max(t.x, Math.min(b.x, t.x + t.width));
    let closestY = Math.max(t.y, Math.min(b.y, t.y + t.height));
    let distance = Math.hypot(b.x - closestX, b.y - closestY);
    return distance < b.radius;
}

// Vòng lặp vẽ liên tục
function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Vẽ mặt đất nền
    ctx.fillStyle = "#654321";
    ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

    // Vẽ trụ súng cao su
    ctx.strokeStyle = "#4a2c11";
    ctx.lineWidth = 8 * scale;
    ctx.beginPath();
    ctx.moveTo(sling.x, sling.y);
    ctx.lineTo(sling.x, groundY);
    ctx.stroke();

    if (gameState === "PLAYING") {
        // Vẽ dây súng cao su khi kéo
        ctx.strokeStyle = "#4a2c11";
        ctx.lineWidth = 5 * scale;
        ctx.beginPath();
        ctx.moveTo(sling.x, sling.y);
        ctx.lineTo(bird.x, bird.y);
        ctx.stroke();

        if (bird.isLaunched) {
            bird.x += bird.vx;
            bird.y += bird.vy;
            bird.vy += 0.25; // Trọng lực ổn định

            if (bird.y + bird.radius >= groundY || bird.x > canvas.width || bird.x < 0) {
                resetBird();
            }
        }

        // Vẽ Chim
        ctx.fillStyle = "#ff3333";
        ctx.beginPath();
        ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
        ctx.fill();

        // Vẽ Khối hộp mục tiêu
        let allDead = true;
        targets.forEach(t => {
            if (t.alive) {
                allDead = false;
                if (checkCollision(bird, t)) {
                    t.alive = false;
                    score += 100;
                    scoreEl.textContent = score;
                }
                ctx.fillStyle = "#8ddb44";
                ctx.fillRect(t.x, t.y, t.width, t.height);
                ctx.strokeStyle = "#558822";
                ctx.lineWidth = 2 * scale;
ctx.strokeRect(t.x, t.y, t.width, t.height);
}
});
if (allDead && targets.length > 0) {
endGame(true);
}
} else {
// Chim đậu trên súng ở màn hình Menu
ctx.fillStyle = "#ff3333";
ctx.beginPath();
ctx.arc(sling.x, sling.y, 18 * scale, 0, Math.PI * 2);
ctx.fill();
}
requestAnimationFrame(update);
}
// Chạy lần đầu tiên để dựng giao diện nền
resizeCanvas();
update();
