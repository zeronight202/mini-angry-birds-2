<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Angry Birds Mini Clone</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #222;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            background: #70c5ce;
            display: block;
            width: 100%;
            height: 100%;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .overlay h1 {
            font-size: 48px;
            margin: 0 0 20px 0;
            color: #ff3333;
            text-shadow: 2px 2px 5px black;
        }
        .overlay p {
            font-size: 20px;
            margin: 0 0 30px 0;
        }
        .btn {
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            background: #8ddb44;
            color: #222;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 0 #558822;
            transition: 0.1s;
        }
        .btn:hover {
            background: #a2e85c;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #558822;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div id="startScreen" class="overlay">
            <h1>ANGRY BIRDS MINI</h1>
            <p>Bắn hạ toàn bộ khối hộp với 3 chú chim dự phòng!</p>
            <button class="btn" id="startBtn">CHƠI NGAY</button>
        </div>

        <div id="gameOverScreen" class="overlay hidden">
            <h1 id="gameOverTitle">CHIẾN THẮNG!</h1>
            <p id="finalText">Tổng số điểm của bạn: 0</p>
            <button class="btn" id="restartBtn">CHƠI LẠI</button>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOverScreen");
const gameOverTitle = document.getElementById("gameOverTitle");
const finalText = document.getElementById("finalText");

const startBtn = document.getElementById("startBtn");
const restartBtn = document.getElementById("restartBtn");

let gameState = "MENU"; 
let score = 0;
let lives = 3;
let groundY = 0;
let scale = 1;

let sling = { x: 0, y: 0, radius: 15 };
let bird = { x: 0, y: 0, radius: 15, vx: 0, vy: 0, isDragging: false, isLaunched: false };
let targets = [];
let decorationTrees = [];
let clouds = [];
let buttonRect = { x: 0, y: 0, w: 220, h: 55 };

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    let scaleX = canvas.width / 1200;
    let scaleY = canvas.height / 600;
    scale = Math.min(scaleX, scaleY);
    if (scale < 0.5) scale = 0.5;

    groundY = canvas.height - (80 * scale);
    sling.x = canvas.width * 0.18;
    if (sling.x < 150) sling.x = 150;
    sling.y = groundY - (120 * scale);
    
    if (!bird.isLaunched) {
        bird.x = sling.x;
        bird.y = sling.y;
        bird.radius = 18 * scale;
    }

    buttonRect.w = 220 * scale;
    buttonRect.h = 55 * scale;
    buttonRect.x = (canvas.width - buttonRect.w) / 2;
    buttonRect.y = (canvas.height / 2) + (40 * scale);

    const startX = canvas.width * 0.75;
    const boxW = 50 * scale;
    const boxH = 60 * scale;
    
    targets = [
        { type: "wood", x: startX, y: groundY - boxH, width: boxW, height: boxH, alive: true },
        { type: "pig", x: startX + boxW/2, y: groundY - boxH - (15*scale), alive: true, radius: 15*scale },
        { type: "wood", x: startX + boxW + (20 * scale), y: groundY - boxH, width: boxW, height: boxH, alive: true },
        { type: "pig", x: startX + boxW + (20 * scale) + boxW/2, y: groundY - boxH - (15*scale), alive: true, radius: 15*scale },
        { type: "ice", x: startX + (boxW / 2) + (10 * scale), y: groundY - (boxH * 2) - (10 * scale), width: boxW, height: boxH, alive: true }
    ];

    decorationTrees = [
        { x: canvas.width * 0.05, y: groundY, r: 40 * scale },
        { x: canvas.width * 0.45, y: groundY, r: 35 * scale },
        { x: canvas.width * 0.90, y: groundY, r: 50 * scale }
    ];

    if (clouds.length === 0) {
        clouds = [
            { x: canvas.width * 0.1, y: canvas.height * 0.15, speed: 0.2 * scale, w: 90 * scale },
            { x: canvas.width * 0.5, y: canvas.height * 0.08, speed: 0.15 * scale, w: 120 * scale },
            { x: canvas.width * 0.8, y: canvas.height * 0.2, speed: 0.25 * scale, w: 80 * scale }
        ];
    }
}

function triggerStart() {
    gameState = "PLAYING";
    score = 0;
    lives = 3;
    resizeCanvas();
    resetBird();
    
    startScreen.classList.add("hidden");
    gameOverScreen.classList.add("hidden");
}

startBtn.addEventListener("click", triggerStart);
restartBtn.addEventListener("click", triggerStart);

function endGame(isWin) {
    gameState = "GAMEOVER";
    gameOverScreen.classList.remove("hidden");
    
    if (isWin) {
        gameOverTitle.textContent = "CHIẾN THẮNG!";
        gameOverTitle.style.color = "#8ddb44";
        finalText.innerHTML = "Tổng số điểm của bạn: " + score;
    } else {
        gameOverTitle.textContent = "GAME OVER";
        gameOverTitle.style.color = "#ff3333";
        finalText.innerHTML = "Bạn đã hết mạng! Điểm số: " + score;
    }
}

function getMousePos(e) {
    const rect = canvas.getBoundingClientRect();
    let clientX = e.clientX;
    let clientY = e.clientY;
    
    if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
    } else if (e.changedTouches && e.changedTouches.length > 0) {
        clientX = e.changedTouches[0].clientX;
        clientY = e.changedTouches[0].clientY;
    }
    
    return {
        x: (clientX || 0) - rect.left,
        y: (clientY || 0) - rect.top
    };
}

function startDrag(e) {
    if (gameState !== "PLAYING" || bird.isLaunched || lives <= 0) return;
    const pos = getMousePos(e);
    const dist = Math.hypot(pos.x - bird.x, pos.y - bird.y);
    if (dist < bird.radius + (35 * scale)) {
        bird.isDragging = true;
    }
}

function drag(e) {
    if (!bird.isDragging || gameState !== "PLAYING") return;
    const pos = getMousePos(e);
    
    const distX = pos.x - sling.x;
    const distY = pos.y - sling.y;
    const angle = Math.atan2(distY, distX);
    
    let maxDrag = 130 * scale;
    const dist = Math.min(Math.hypot(distX, distY), maxDrag);

    bird.x = sling.x + Math.cos(angle) * dist;
    bird.y = sling.y + Math.sin(angle) * dist;
}

function endDrag() {
    if (!bird.isDragging || gameState !== "PLAYING") return;
    bird.isDragging = false;
    bird.isLaunched = true;

    bird.vx = (sling.x - bird.x) * 0.22;
    bird.vy = (sling.y - bird.y) * 0.22;
}

canvas.addEventListener("mousedown", startDrag);
canvas.addEventListener("mousemove", drag);
window.addEventListener("mouseup", endDrag);

canvas.addEventListener("touchstart", function(e) { startDrag(e); }, { passive: true });
canvas.addEventListener("touchmove", function(e) { drag(e); }, { passive: true });
window.addEventListener("touchend", endDrag);

window.addEventListener("resize", () => {
    resizeCanvas();
});

function resetBird() {
    bird.x = sling.x;
    bird.y = sling.y;
    bird.vx = 0;
    bird.vy = 0;
    bird.isLaunched = false;
}

function checkCollision(b, t) {
    if (!t.alive) return false;
    if (t.type === "pig") {
        let distance = Math.hypot(b.x - t.x, b.y - t.y);
        return distance < b.radius + t.radius;
    } else {
        let closestX = Math.max(t.x, Math.min(b.x, t.x + t.width));
        let closestY = Math.max(t.y, Math.min(b.y, t.y + t.height));
        let distance = Math.hypot(b.x - closestX, b.y - closestY);
        return distance < b.radius;
    }
}

function drawBird(x, y, r) {
    ctx.fillStyle = "#ff3333";
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#990000";
    ctx.lineWidth = 2 * scale;
    ctx.stroke();

    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(x + r*0.4, y - r*0.2, r*0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.arc(x + r*0.5, y - r*0.2, r*0.1, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#ffcc00";
    ctx.beginPath();
    ctx.moveTo(x + r*0.8, y);
    ctx.lineTo(x + r*1.2, y + r*0.1);
    ctx.lineTo(x + r*0.8, y + r*0.2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
}

function drawPig(x, y, r) {
    ctx.fillStyle = "#8ddb44";
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#558822";
    ctx.lineWidth = 2 * scale;
    ctx.stroke();

    ctx.fillStyle = "#6cb82d";
    ctx.beginPath();
    ctx.arc(x, y + r*0.1, r*0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(x - r*0.3, y - r*0.2, r*0.2, 0, Math.PI * 2);
    ctx.arc(x + r*0.3, y - r*0.2, r*0.2, 0, Math.PI * 2);
    ctx.fill();
ctx.fillStyle = "#000";
ctx.beginPath();
ctx.arc(x - r0.25, y - r0.2, r0.07, 0, Math.PI * 2);
ctx.arc(x + r0.35, y - r0.2, r0.07, 0, Math.PI * 2);
ctx.fill();
}
function update() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
let gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
gradient.addColorStop(0, "#1a80b8");
gradient.addColorStop(0.6, "#70c5ce");
gradient.addColorStop(1, "#9be2e6");
ctx.fillStyle = gradient;
ctx.fillRect(0, 0, canvas.width, canvas.height);
clouds.forEach(c => {
c.x += c.speed;
if (c.x > canvas.width) c.x = -c.w;
ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
ctx.beginPath();
ctx.arc(c.x, c.y, c.w * 0.3, 0, Math.PI * 2);
ctx.arc(c.x + c.w * 0.25, c.y - c.w * 0.1, c.w * 0.35, 0, Math.PI * 2);
ctx.arc(c.x + c.w * 0.5, c.y, c.w * 0.25, 0, Math.PI * 2);
ctx.fill();
});
decorationTrees.forEach(tree => {
ctx.fillStyle = "#3a5f16";
ctx.beginPath();
ctx.arc(tree.x, tree.y - tree.r0.6, tree.r, 0, Math.PI * 2);
ctx.fill();
ctx.fillStyle = "#497c1a";
ctx.beginPath();
ctx.arc(tree.x - tree.r0.2, tree.y - tree.r*0.8, tree.r * 0.8, 0, Math.PI * 2);
ctx.fill();
});
ctx.fillStyle = "#6d4c20";
ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
ctx.fillStyle = "#5c9e32";
ctx.fillRect(0, groundY, canvas.width, 15 * scale);
ctx.strokeStyle = "#422813";
ctx.lineWidth = 8 * scale;
ctx.beginPath();
ctx.moveTo(sling.x, sling.y);
ctx.lineTo(sling.x, groundY);
ctx.stroke();
if (gameState === "MENU") {
drawBird(sling.x, sling.y, 18 * scale);
} else if (gameState === "PLAYING") {
ctx.fillStyle = "#fff";
ctx.font = "bold 24px Arial";
ctx.textAlign = "center";
ctx.fillText("ĐIỂM SỐ: " + score, canvas.width / 2, 40);
for (let i = 0; i < lives - 1; i++) {
drawBird(sling.x - 45 - (i * 35), groundY - (18 * scale), 15 * scale);
}
if (bird.isDragging) {
ctx.strokeStyle = "#2b1609";
ctx.lineWidth = 5 * scale;
ctx.beginPath();
ctx.moveTo(sling.x, sling.y);
ctx.lineTo(bird.x, bird.y);
ctx.stroke();
let simX = bird.x;
let simY = bird.y;
let simVx = (sling.x - bird.x) * 0.22;
let simVy = (sling.y - bird.y) * 0.22;
ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
for (let i = 0; i < 30; i += 2) {
simX += simVx * 2;
simY += simVy * 2;
simVy += 0.22 * 2;
if (simY >= groundY || simX > canvas.width || simX < 0) break;
ctx.beginPath();
ctx.arc(simX, simY, 4 * scale, 0, Math.PI * 2);
ctx.fill();
}
}
if (bird.isLaunched) {
bird.x += bird.vx;
bird.y += bird.vy;
bird.vy += 0.22;
if (bird.y + bird.radius >= groundY || bird.x > canvas.width || bird.x < 0) {
bird.isLaunched = false;
lives--;
let pigAlive = false;
targets.forEach(t => { if (t.type === "pig" && t.alive) pigAlive = true; });
if (pigAlive && lives === 0) {
endGame(false);
} else if (!pigAlive) {
endGame(true);
} else {
resetBird();
}
}
}
if (!bird.isLaunched && lives > 0) {
drawBird(bird.x, bird.y, bird.radius);
} else if (bird.isLaunched && bird.y + bird.radius < groundY) {
drawBird(bird.x, bird.y, bird.radius);
}
let pigAlive = false;
targets.forEach(t => {
if (t.alive) {
if (t.type === "pig") pigAlive = true;
if (checkCollision(bird, t)) {
t.alive = false;
score += 100;
}
if (t.type === "pig") {
drawPig(t.x, t.y, t.radius);
} else {
ctx.fillStyle = t.type === "wood" ? "#bf8339" : "#a1d7f0";
ctx.fillRect(t.x, t.y, t.width, t.height);
ctx.strokeStyle = t.type === "wood" ? "#8a571c" : "#60abcf";
ctx.lineWidth = 2 * scale;
ctx.strokeRect(t.x, t.y, t.width, t.height);
}
}
});
if (!pigAlive && targets.length > 0) {
endGame(true);
}
} else {
ctx.fillStyle = "#ff3333";
ctx.beginPath();
ctx.arc(sling.x, sling.y, bird.radius, 0, Math.PI * 2);
ctx.fill();
}
requestAnimationFrame(update);
}
resizeCanvas();
update();
