<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angry Birds Mini Clone</title>
    <style>
        body {
            margin: 0;
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            color: white;
            overflow: hidden;
            position: relative;
        }
        #gameContainer {
            position: relative;
            width: 800px;
            height: 400px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            background: #70c5ce;
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            z-index: 5;
            text-shadow: 1px 1px 3px black;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .overlay h1 {
            font-size: 44px;
            margin: 0 0 20px 0;
            color: #ff3333;
            text-shadow: 2px 2px 5px black;
        }
        .overlay p {
            font-size: 18px;
            margin: 0 0 30px 0;
        }
        .btn {
            padding: 12px 35px;
            font-size: 22px;
            font-weight: bold;
            background: #8ddb44;
            color: #222;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 0 #558822;
            transition: 0.1s;
        }
        .btn:hover {
            background: #a2e85c;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #558822;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <!-- Bảng điểm -->
        <div id="ui" class="hidden">Điểm: <span id="score">0</span></div>

        <!-- MENU BẮT ĐẦU -->
        <div id="startScreen" class="overlay">
            <h1>ANGRY BIRDS MINI</h1>
            <p>Bắn hạ toàn bộ khối hộp với 3 chú chim dự phòng!</p>
            <button class="btn" onclick="startGame()">CHƠI NGAY</button>
        </div>

        <!-- MÀN HÌNH KẾT THÚC -->
        <div id="gameOverScreen" class="overlay hidden">
            <h1 id="gameOverTitle">CHIẾN THẮNG!</h1>
            <p id="finalText">Tổng số điểm của bạn: 0</p>
            <button class="btn" onclick="restartGame()">CHƠI LẠI</button>
        </div>

        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const ui = document.getElementById("ui");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOverScreen");
const gameOverTitle = document.getElementById("gameOverTitle");
const finalText = document.getElementById("finalText");

let gameState = "MENU"; 
let score = 0;
let lives = 3;
const groundY = 350;

const sling = { x: 150, y: 280, radius: 15 };

let bird = {
    x: sling.x,
    y: sling.y,
    radius: 15,
    vx: 0,
    vy: 0,
    isDragging: false,
    isLaunched: false
};

let targets = [];

function initTargets() {
    targets = [
        { x: 600, y: 300, width: 40, height: 50, alive: true },
        { x: 650, y: 300, width: 40, height: 50, alive: true },
        { x: 625, y: 250, width: 40, height: 50, alive: true }
    ];
}

function startGame() {
    gameState = "PLAYING";
    score = 0;
    lives = 3;
    scoreEl.textContent = score;
    initTargets();
    resetBird();
    
    startScreen.classList.add("hidden");
    gameOverScreen.classList.add("hidden");
    ui.classList.remove("hidden");
}

function endGame(isWin) {
    gameState = "GAMEOVER";
    ui.classList.add("hidden");
    gameOverScreen.classList.remove("hidden");
    
    if (isWin) {
        gameOverTitle.textContent = "CHIẾN THẮNG!";
        gameOverTitle.style.color = "#8ddb44";
        finalText.innerHTML = "Tổng số điểm của bạn: " + score;
    } else {
        gameOverTitle.textContent = "GAME OVER";
        gameOverTitle.style.color = "#ff3333";
        finalText.innerHTML = "Bạn đã hết mạng! Điểm số: " + score;
    }
}

function restartGame() {
    startGame();
}

function getMousePos(e) {
    const rect = canvas.getBoundingClientRect();
    let clientX = e.clientX;
    let clientY = e.clientY;
    
    if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
    }
    
    return {
        x: (clientX || 0) - rect.left,
        y: (clientY || 0) - rect.top
    };
}

function startDrag(e) {
    if (gameState !== "PLAYING" || bird.isLaunched || lives <= 0) return;
    const pos = getMousePos(e);
    const dist = Math.hypot(pos.x - bird.x, pos.y - bird.y);
    if (dist < bird.radius + 20) {
        bird.isDragging = true;
    }
}

function drag(e) {
    if (!bird.isDragging || gameState !== "PLAYING") return;
    const pos = getMousePos(e);
    
    const distX = pos.x - sling.x;
    const distY = pos.y - sling.y;
    const angle = Math.atan2(distY, distX);
    const dist = Math.min(Math.hypot(distX, distY), 100);

    bird.x = sling.x + Math.cos(angle) * dist;
    bird.y = sling.y + Math.sin(angle) * dist;
}

function endDrag() {
    if (!bird.isDragging || gameState !== "PLAYING") return;
    bird.isDragging = false;
    bird.isLaunched = true;

    bird.vx = (sling.x - bird.x) * 0.22;
    bird.vy = (sling.y - bird.y) * 0.22;
}

canvas.addEventListener("mousedown", startDrag);
canvas.addEventListener("mousemove", drag);
window.addEventListener("mouseup", endDrag);

canvas.addEventListener("touchstart", function(e) { startDrag(e); }, { passive: true });
canvas.addEventListener("touchmove", function(e) { drag(e); }, { passive: true });
window.addEventListener("touchend", endDrag);

function resetBird() {
    bird.x = sling.x;
    bird.y = sling.y;
    bird.vx = 0;
    bird.vy = 0;
    bird.isLaunched = false;
}

function checkCollision(b, t) {
    if (!t.alive) return false;
    let closestX = Math.max(t.x, Math.min(b.x, t.x + t.width));
    let closestY = Math.max(t.y, Math.min(b.y, t.y + t.height));
    let distance = Math.hypot(b.x - closestX, b.y - closestY);
    return distance < b.radius;
}

function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Vẽ mặt đất
    ctx.fillStyle = "#654321";
    ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

    // Vẽ súng cao su
    ctx.strokeStyle = "#4a2c11";
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(sling.x, sling.y);
    ctx.lineTo(sling.x, groundY);
    ctx.stroke();

    if (gameState === "PLAYING") {
        // Vẽ hàng chim dự phòng phía sau súng
        for (let i = 0; i < lives - 1; i++) {
            ctx.fillStyle = "#ff3333";
            ctx.beginPath();
            ctx.arc(sling.x - 40 - (i * 30), groundY - bird.radius, bird.radius, 0, Math.PI * 2);
            ctx.fill();
        }

        // Vẽ dây súng cao su và vệt định hướng chấm tròn
        if (bird.isDragging) {
            ctx.strokeStyle = "#4a2c11";
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(sling.x, sling.y);
            ctx.lineTo(bird.x, bird.y);
            ctx.stroke();

            // Mô phỏng vệt chấm tròn định hướng bay
            let simX = bird.x;
            let simY = bird.y;
            let simVx = (sling.x - bird.x) * 0.22;
            let simVy = (sling.y - bird.y) * 0.22;
            
            ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
            for (let i = 0; i < 20; i++) {
                simX += simVx;
                simY += simVy;
                simVy += 0.2;
                if (simY >= groundY) break;
                if (i % 2 === 0) {
                    ctx.beginPath();
                    ctx.arc(simX, simY, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        // Vật lý chuyển động khi chim bay
        if (bird.isLaunched) {
            bird.x += bird.vx;
            bird.y += bird.vy;
            bird.vy += 0.2;

            if (bird.y + bird.radius >= groundY || bird.x > canvas.width || bird.x < 0) {
                bird.isLaunched = false;
                lives--;
                
                let currentAllDead = true;
                targets.forEach(t => { if (t.alive) currentAllDead = false; });
                
                if (!currentAllDead && lives === 0) {
                    endGame(false);
                } else if (!currentAllDead) {
                    resetBird();
                }
            }
        }

        // Vẽ chú chim đang ngắm bắn
        if (lives > 0 && !bird.isLaunched) {
            ctx.fillStyle = "#ff3333";
            ctx.beginPath();
            ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
            ctx.fill();
        } else if (bird.isLaunched && bird.y + bird.radius < groundY) {
            ctx.fillStyle = "#ff3333";
            ctx.beginPath();
            ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
            ctx.fill();
        }

        // Kiểm tra va chạm và vẽ các khối hộp mục tiêu
        let allDead = true;
        targets.forEach(t => {
            if (t.alive) {
allDead = false;
if (checkCollision(bird, t)) {
t.alive = false;
score += 100;
scoreEl.textContent = score;
}
ctx.fillStyle = "#8ddb44";
ctx.fillRect(t.x, t.y, t.width, t.height);
ctx.strokeStyle = "#558822";
ctx.strokeRect(t.x, t.y, t.width, t.height);
}
});
if (allDead && targets.length > 0) {
endGame(true);
}
} else {
// Chim đậu bệ súng tĩnh ngoài menu
ctx.fillStyle = "#ff3333";
ctx.beginPath();
ctx.arc(sling.x, sling.y, bird.radius, 0, Math.PI * 2);
ctx.fill();
}
requestAnimationFrame(update);
}
initTargets();
update();
