<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Angry Birds Mini Clone</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #111;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }
        #gameWrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #70c5ce;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .overlay h1 {
            font-size: clamp(32px, 6vw, 56px);
            margin: 0 0 15px 0;
            color: #ff3333;
            text-shadow: 2px 2px 5px black;
            letter-spacing: 2px;
        }
        .overlay p {
            font-size: clamp(16px, 2.5vw, 22px);
            margin: 0 0 30px 0;
            color: #ccc;
            max-width: 600px;
            line-height: 1.4;
        }
        .btn {
            padding: 14px 45px;
            font-size: clamp(18px, 2vw, 24px);
            font-weight: bold;
            background: #8ddb44;
            color: #111;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 0 #558822;
            transition: all 0.1s ease;
        }
        .btn:hover {
            background: #a2e85c;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #558822;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="gameWrapper">
        <!-- MENU BẮT ĐẦU -->
        <div id="startScreen" class="overlay">
            <h1>ANGRY BIRDS MINI</h1>
            <p>Kéo ngược và thả chú chim màu đỏ để bắn hạ toàn bộ khối hộp! Bạn có tổng cộng 3 chú chim thay phiên nhau.</p>
            <button class="btn" onclick="startGame()">CHƠI NGAY</button>
        </div>

        <!-- MÀN HÌNH KẾT THÚC -->
        <div id="gameOverScreen" class="overlay hidden">
            <h1 id="gameOverTitle">CHIẾN THẮNG!</h1>
            <p id="finalText">Tổng số điểm của bạn: 0</p>
            <button class="btn" onclick="restartGame()">CHƠI LẠI</button>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOverScreen");
const gameOverTitle = document.getElementById("gameOverTitle");
const finalText = document.getElementById("finalText");

// Kích thước logic cố định bên trong game để tính toán vật lý không bị lệch
const VIRTUAL_WIDTH = 1000;
const VIRTUAL_HEIGHT = 500;

let gameState = "MENU"; 
let score = 0;
let lives = 3;
const groundY = 430;

const sling = { x: 180, y: 340, radius: 15 };
let bird = { x: 180, y: 340, radius: 15, vx: 0, vy: 0, isDragging: false, isLaunched: false };
let targets = [];

// Hàm chuẩn hóa kích thước canvas vừa khít màn hình thiết bị (Không bị thu nhỏ thành khung chữ nhật)
function fitCanvasToWindow() {
    const windowWidth = window.innerWidth;
    const windowHeight = window.innerHeight;
    
    // Tính tỷ lệ để phóng to canvas tràn màn hình mà không làm biến dạng tỷ lệ logic
    const scaleX = windowWidth / VIRTUAL_WIDTH;
    const scaleY = windowHeight / VIRTUAL_HEIGHT;
    const scaleToFit = Math.min(scaleX, scaleY);
    
    canvas.width = VIRTUAL_WIDTH * scaleToFit;
    canvas.height = VIRTUAL_HEIGHT * scaleToFit;
    
    // Sử dụng cơ chế scale tự động của Canvas để đồng bộ mọi tọa độ bên dưới
    ctx.setTransform(scaleToFit, 0, 0, scaleToFit, 0, 0);
}

function initTargets() {
    targets = [
        { x: 750, y: groundY - 50, width: 45, height: 50, alive: true },
        { x: 805, y: groundY - 50, width: 45, height: 50, alive: true },
        { x: 777, y: groundY - 100, width: 45, height: 50, alive: true }
    ];
}

function startGame() {
    gameState = "PLAYING";
    score = 0;
    lives = 3;
    fitCanvasToWindow();
    initTargets();
    resetBird();
    
    startScreen.classList.add("hidden");
    gameOverScreen.classList.add("hidden");
}

function endGame(isWin) {
    gameState = "GAMEOVER";
    gameOverScreen.classList.remove("hidden");
    
    if (isWin) {
        gameOverTitle.textContent = "CHIẾN THẮNG!";
        gameOverTitle.style.color = "#8ddb44";
        finalText.innerHTML = "Tuyệt vời! Tổng số điểm của bạn đạt được: " + score;
    } else {
        gameOverTitle.textContent = "GAME OVER";
        gameOverTitle.style.color = "#ff3333";
        finalText.innerHTML = "Bạn đã hết lượt bắn! Số điểm ghi được: " + score;
    }
}

function restartGame() {
    startGame();
}

// Chuyển đổi tọa độ chạm thực tế của chuột/tay thành tọa độ logic bên trong game
function getCanvasMousePos(e) {
    const rect = canvas.getBoundingClientRect();
    let clientX = 0;
    let clientY = 0;
    
    if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
    } else {
        clientX = e.clientX;
        clientY = e.clientY;
    }
    
    // Tính toán tỷ lệ co giãn thực tế
    const scaleX = VIRTUAL_WIDTH / rect.width;
    const scaleY = VIRTUAL_HEIGHT / rect.height;
    
    return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
    };
}

function startDrag(e) {
    if (gameState !== "PLAYING" || bird.isLaunched || lives <= 0) return;
    const pos = getCanvasMousePos(e);
    const dist = Math.hypot(pos.x - bird.x, pos.y - bird.y);
    // Tăng bán kính tương tác để dễ bấm kéo trên cả điện thoại màn hình nhỏ
    if (dist < bird.radius + 35) {
        bird.isDragging = true;
    }
}

function drag(e) {
    if (!bird.isDragging || gameState !== "PLAYING") return;
    const pos = getCanvasMousePos(e);
    
    const distX = pos.x - sling.x;
    const distY = pos.y - sling.y;
    const angle = Math.atan2(distY, distX);
    
    // Giới hạn tầm kéo căng của dây cao su
    const dist = Math.min(Math.hypot(distX, distY), 110);

    bird.x = sling.x + Math.cos(angle) * dist;
    bird.y = sling.y + Math.sin(angle) * dist;
}

function endDrag() {
    if (!bird.isDragging || gameState !== "PLAYING") return;
    bird.isDragging = false;
    bird.isLaunched = true;

    // Lực bắn (vx, vy) được cân bằng chuẩn xác để ngắm bắn mượt mà
    bird.vx = (sling.x - bird.x) * 0.22;
    bird.vy = (sling.y - bird.y) * 0.22;
}

// Lắng nghe sự kiện chuột trên PC
canvas.addEventListener("mousedown", startDrag);
canvas.addEventListener("mousemove", drag);
window.addEventListener("mouseup", endDrag);

// Lắng nghe sự kiện cảm ứng trên Điện thoại/Máy tính bảng
canvas.addEventListener("touchstart", function(e) { startDrag(e); }, { passive: true });
canvas.addEventListener("touchmove", function(e) { drag(e); }, { passive: true });
window.addEventListener("touchend", endDrag);

window.addEventListener("resize", fitCanvasToWindow);

function resetBird() {
    bird.x = sling.x;
    bird.y = sling.y;
    bird.vx = 0;
    bird.vy = 0;
    bird.isLaunched = false;
}

function checkCollision(b, t) {
    if (!t.alive) return false;
    let closestX = Math.max(t.x, Math.min(b.x, t.x + t.width));
    let closestY = Math.max(t.y, Math.min(b.y, t.y + t.height));
    let distance = Math.hypot(b.x - closestX, b.y - closestY);
    return distance < b.radius;
}

function update() {
    ctx.clearRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);

    // Vẽ nền bầu trời giả lập (Xử lý khoảng trống rìa ngoài canvas)
    ctx.fillStyle = "#70c5ce";
    ctx.fillRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);

    // Vẽ mặt đất màu nâu vững chãi
    ctx.fillStyle = "#654321";
    ctx.fillRect(0, groundY, VIRTUAL_WIDTH, VIRTUAL_HEIGHT - groundY);
    ctx.fillStyle = "#558822";
    ctx.fillRect(0, groundY, VIRTUAL_WIDTH, 12); // Lớp cỏ xanh trên đất

    // Vẽ trụ súng cao su màu gỗ độc lập
    ctx.strokeStyle = "#4a2c11";
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(sling.x, sling.y);
    ctx.lineTo(sling.x, groundY);
    ctx.stroke();

    if (gameState === "PLAYING") {
        // Hiển thị giao diện văn bản chữ điểm số phía trên
        ctx.fillStyle = "#fff";
        ctx.font = "bold 24px Arial";
        ctx.textAlign = "center";
        ctx.fillText("ĐIỂM SỐ: " + score, VIRTUAL_WIDTH / 2, 45);

        // Vẽ hàng chim dự phòng xếp hàng phía sau bệ bắn
        for (let i = 0; i < lives - 1; i++) {
            ctx.fillStyle = "#ff3333";
            ctx.beginPath();
            ctx.arc(sling.x - 45 - (i * 35), groundY - bird.radius, bird.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#b31a1a";
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // Vẽ dây súng cao su đàn hồi và vệt chấm ngắm bắn định hướng
        if (bird.isDragging) {
            ctx.strokeStyle = "#221205";
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(sling.x, sling.y);
ctx.lineTo(bird.x, bird.y);
ctx.stroke();
// Tính toán mô phỏng quỹ đạo bay chấm tròn
let simX = bird.x;
let simY = bird.y;
let simVx = (sling.x - bird.x) * 0.22;
let simVy = (sling.y - bird.y) * 0.22;
ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
for (let i = 0; i < 30; i++) {
simX += simVx;
simY += simVy;
simVy += 0.22; // Trọng lực ảo định hướng
if (simY >= groundY) break;
if (i % 2 === 0) {
ctx.beginPath();
ctx.arc(simX, simY, 4, 0, Math.PI * 2);
ctx.fill();
}
}
}
// Cập nhật chuyển động vật lý khi chim bay
if (bird.isLaunched) {
bird.x += bird.vx;
bird.y += bird.vy;
bird.vy += 0.22; // Trọng lực rơi tự do chuẩn
// Xử lý khi chim bay ra ngoài biên hoặc chạm đất rơi xuống
if (bird.y + bird.radius >= groundY || bird.x > VIRTUAL_WIDTH || bird.x < 0) {
bird.isLaunched = false;
lives--;
let currentAllDead = true;
targets.forEach(t => { if (t.alive) currentAllDead = false; });
if (!currentAllDead && lives === 0) {
endGame(false);
} else if (!currentAllDead) {
resetBird();
}
}
}
// Vẽ chim đỏ ngắm bắn chính thức
if (lives > 0 && (!bird.isLaunched || (bird.isLaunched && bird.y + bird.radius < groundY))) {
ctx.fillStyle = "#ff3333";
ctx.beginPath();
ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
ctx.fill();
ctx.strokeStyle = "#b31a1a";
ctx.lineWidth = 2;
ctx.stroke();
}
// Xử lý kiểm tra va chạm cấu trúc và vẽ mục tiêu
let allDead = true;
targets.forEach(t => {
if (t.alive) {
allDead = false;
if (checkCollision(bird, t)) {
t.alive = false;
score += 100;
}
ctx.fillStyle = "#8ddb44";
ctx.fillRect(t.x, t.y, t.width, t.height);
ctx.strokeStyle = "#558822";
ctx.lineWidth = 3;
ctx.strokeRect(t.x, t.y, t.width, t.height);
}
});
if (allDead && targets.length > 0) {
endGame(true);
}
} else {
// Trạng thái menu hoặc gameover: vẽ chim nằm yên tĩnh trên bệ súng cao su
ctx.fillStyle = "#ff3333";
ctx.beginPath();
ctx.arc(sling.x, sling.y, bird.radius, 0, Math.PI * 2);
ctx.fill();
ctx.strokeStyle = "#b31a1a";
ctx.lineWidth = 2;
ctx.stroke();
}
requestAnimationFrame(update);
}
// Khởi chạy đồng bộ màn hình lập tức
fitCanvasToWindow();
initTargets();
update();
