<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angry Birds Fix</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #222;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            background: #70c5ce;
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let gameState = "MENU"; 
let score = 0;
let lives = 3;
let groundY = 0;

let sling = { x: 0, y: 0, radius: 15 };
let bird = { x: 0, y: 0, radius: 15, vx: 0, vy: 0, isDragging: false, isLaunched: false };
let targets = [];
let buttonRect = { x: 0, y: 0, w: 200, h: 50 };

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    groundY = canvas.height * 0.85;
    sling.x = canvas.width * 0.18;
    if (sling.x < 150) sling.x = 150;
    sling.y = groundY - 70;
    
    if (!bird.isLaunched) {
        bird.x = sling.x;
        bird.y = sling.y;
    }

    buttonRect.w = 200;
    buttonRect.h = 50;
    buttonRect.x = (canvas.width - buttonRect.w) / 2;
    buttonRect.y = (canvas.height / 2) + 40;
}

function initTargets() {
    const startX = canvas.width * 0.75;
    targets = [
        { x: startX, y: groundY - 50, width: 40, height: 50, alive: true },
        { x: startX + 50, y: groundY - 50, width: 40, height: 50, alive: true },
        { x: startX + 25, y: groundY - 100, width: 40, height: 50, alive: true }
    ];
}

function getMousePos(e) {
    const rect = canvas.getBoundingClientRect();
    let clientX = 0;
    let clientY = 0;
    
    if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
    } else if (e.changedTouches && e.changedTouches.length > 0) {
        clientX = e.changedTouches[0].clientX;
        clientY = e.changedTouches[0].clientY;
    } else {
        clientX = e.clientX;
        clientY = e.clientY;
    }
    
    return {
        x: (clientX || 0) - rect.left,
        y: (clientY || 0) - rect.top
    };
}

function handleInteractionStart(e) {
    const pos = getMousePos(e);
    
    if (gameState === "MENU" || gameState === "GAMEOVER") {
        if (pos.x >= buttonRect.x && pos.x <= buttonRect.x + buttonRect.w &&
            pos.y >= buttonRect.y && pos.y <= buttonRect.y + buttonRect.h) {
            gameState = "PLAYING";
            score = 0;
            lives = 3;
            resizeCanvas();
            initTargets();
            resetBird();
        }
    } else if (gameState === "PLAYING") {
        if (!bird.isLaunched && lives > 0) {
            const dist = Math.hypot(pos.x - bird.x, pos.y - bird.y);
            if (dist < bird.radius + 30) {
                bird.isDragging = true;
            }
        }
    }
}

function handleInteractionMove(e) {
    if (gameState !== "PLAYING" || !bird.isDragging) return;
    const pos = getMousePos(e);
    
    const distX = pos.x - sling.x;
    const distY = pos.y - sling.y;
    const angle = Math.atan2(distY, distX);
    
    let maxDrag = 150;
    const dist = Math.min(Math.hypot(distX, distY), maxDrag);

    bird.x = sling.x + Math.cos(angle) * dist;
    bird.y = sling.y + Math.sin(angle) * dist;
}

function handleInteractionEnd() {
    if (gameState !== "PLAYING" || !bird.isDragging) return;
    bird.isDragging = false;
    bird.isLaunched = true;

    bird.vx = (sling.x - bird.x) * 0.22;
    bird.vy = (sling.y - bird.y) * 0.22;
}

canvas.addEventListener("mousedown", handleInteractionStart);
canvas.addEventListener("mousemove", handleInteractionMove);
window.addEventListener("mouseup", handleInteractionEnd);

canvas.addEventListener("touchstart", function(e) { handleInteractionStart(e); }, { passive: true });
canvas.addEventListener("touchmove", function(e) { handleInteractionMove(e); }, { passive: true });
window.addEventListener("touchend", handleInteractionEnd);

window.addEventListener("resize", () => {
    resizeCanvas();
    if (gameState === "PLAYING") {
        initTargets();
    }
});

function resetBird() {
    bird.x = sling.x;
    bird.y = sling.y;
    bird.vx = 0;
    bird.vy = 0;
    bird.isLaunched = false;
}

function checkCollision(b, t) {
    if (!t.alive) return false;
    let closestX = Math.max(t.x, Math.min(b.x, t.x + t.width));
    let closestY = Math.max(t.y, Math.min(b.y, t.y + t.height));
    let distance = Math.hypot(b.x - closestX, b.y - closestY);
    return distance < b.radius;
}

function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#654321";
    ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

    ctx.strokeStyle = "#4a2c11";
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(sling.x, sling.y);
    ctx.lineTo(sling.x, groundY);
    ctx.stroke();

    if (gameState === "MENU") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#ff3333";
        ctx.font = "bold 48px Arial";
        ctx.textAlign = "center";
        ctx.fillText("ANGRY BIRDS MINI", canvas.width / 2, canvas.height / 3);

        ctx.fillStyle = "#fff";
        ctx.font = "20px Arial";
        ctx.fillText("Bắn hạ toàn bộ khối hộp với 3 chú chim dự phòng!", canvas.width / 2, canvas.height / 2);

        ctx.fillStyle = "#8ddb44";
        ctx.beginPath();
        ctx.rect(buttonRect.x, buttonRect.y, buttonRect.w, buttonRect.h);
        ctx.fill();

        ctx.fillStyle = "#222";
        ctx.font = "bold 22px Arial";
        ctx.fillText("CHƠI NGAY", canvas.width / 2, buttonRect.y + 33);
    } else if (gameState === "GAMEOVER") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        let currentAllDead = true;
        targets.forEach(t => { if (t.alive) currentAllDead = false; });

        ctx.fillStyle = currentAllDead ? "#8ddb44" : "#ff3333";
        ctx.font = "bold 48px Arial";
        ctx.textAlign = "center";
        ctx.fillText(currentAllDead ? "CHIẾN THẮNG!" : "GAME OVER", canvas.width / 2, canvas.height / 3);

        ctx.fillStyle = "#fff";
        ctx.font = "24px Arial";
        ctx.fillText(currentAllDead ? "Tổng số điểm của bạn: " + score : "Bạn đã hết mạng! Điểm số: " + score, canvas.width / 2, canvas.height / 2);

        ctx.fillStyle = "#8ddb44";
        ctx.beginPath();
        ctx.rect(buttonRect.x, buttonRect.y, buttonRect.w, buttonRect.h);
        ctx.fill();

        ctx.fillStyle = "#222";
        ctx.font = "bold 22px Arial";
        ctx.fillText(currentAllDead ? "CHƠI LẠI" : "THỬ LẠI", canvas.width / 2, buttonRect.y + 33);
    } else if (gameState === "PLAYING") {
        ctx.fillStyle = "#fff";
        ctx.font = "bold 24px Arial";
        ctx.textAlign = "center";
        ctx.fillText("Điểm: " + score, canvas.width / 2, 40);

        for (let i = 0; i < lives - 1; i++) {
            ctx.fillStyle = "#ff3333";
            ctx.beginPath();
            ctx.arc(sling.x - 40 - (i * 35), groundY - bird.radius, bird.radius, 0, Math.PI * 2);
            ctx.fill();
        }

        if (bird.isDragging) {
            ctx.strokeStyle = "#4a2c11";
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(sling.x, sling.y);
            ctx.lineTo(bird.x, bird.y);
            ctx.stroke();

            let simX = bird.x;
            let simY = bird.y;
            let simVx = (sling.x - bird.x) * 0.22;
            let simVy = (sling.y - bird.y) * 0.22;
            
            ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
            for (let i = 0; i < 30; i += 2) {
                simX += simVx * 2;
                simY += simVy * 2;
                simVy += 0.2 * 2;
                
                if (simY >= groundY || simX > canvas.width || simX < 0) break;
                
                ctx.beginPath();
                ctx.arc(simX, simY, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        if (bird.isLaunched) {
            bird.x += bird.vx;
            bird.y += bird.vy;
            bird.vy += 0.2;

            if (bird.y + bird.radius >= groundY || bird.x > canvas.width || bird.x < 0) {
                bird.isLaunched = false;
                lives--;
                
                let currentAllDead = true;
                targets.forEach(t => { if (t.alive) currentAllDead = false; });
                
                if (!currentAllDead && lives === 0) {
                    gameState = "GAMEOVER";
                } else if (!currentAllDead) {
                    resetBird();
                }
            }
        }

        if (!bird.isLaunched && lives > 0) {
            ctx.fillStyle = "#ff3333";
            ctx.beginPath();
            ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
            ctx.fill();
        } else if (bird.isLaunched && bird.y + bird.radius < groundY) {
            ctx.fillStyle = "#ff3333";
            ctx.beginPath();
            ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
            ctx.fill();
        }

        let allDead = true;
        targets.forEach(t => {
            if (t.alive) {
                allDead = false;
                if (checkCollision(bird, t)) {
                    t.alive = false;
                    score += 100;
                }
                ctx.fillStyle = "#8ddb44";
ctx.fillRect(t.x, t.y, t.width, t.height);
ctx.strokeStyle = "#558822";
ctx.strokeRect(t.x, t.y, t.width, t.height);
}
});
if (allDead && targets.length > 0) {
gameState = "GAMEOVER";
}
}
requestAnimationFrame(update);
}
resizeCanvas();
update();
