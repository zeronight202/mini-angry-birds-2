<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Angry Birds Mini Clone</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #222;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            background: #70c5ce;
            display: block;
            width: 100%;
            height: 100%;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .overlay h1 {
            font-size: 48px;
            margin: 0 0 20px 0;
            color: #ff3333;
            text-shadow: 2px 2px 5px black;
        }
        .overlay p {
            font-size: 20px;
            margin: 0 0 30px 0;
        }
        .btn {
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            background: #8ddb44;
            color: #222;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 0 #558822;
            transition: 0.1s;
        }
        .btn:hover {
            background: #a2e85c;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #558822;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div id="startScreen" class="overlay">
            <h1>ANGRY BIRDS MINI</h1>
            <p>Bắn hạ toàn bộ khối hộp với 3 chú chim dự phòng!</p>
            <button class="btn" id="startBtn" onclick="triggerStart()">CHƠI NGAY</button>
        </div>

        <div id="gameOverScreen" class="overlay hidden">
            <h1 id="gameOverTitle">CHIẾN THẮNG!</h1>
            <p id="finalText">Tổng số điểm của bạn: 0</p>
            <button class="btn" id="restartBtn" onclick="triggerStart()">CHƠI LẠI</button>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOverScreen");
const gameOverTitle = document.getElementById("gameOverTitle");
const finalText = document.getElementById("finalText");

let gameState = "MENU"; 
let score = 0;
let lives = 3;
let groundY = 0;
let scale = 1;

let sling = { x: 0, y: 0, radius: 15 };
let bird = { x: 0, y: 0, radius: 15, vx: 0, vy: 0, isDragging: false, isLaunched: false };
let targets = [];

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    let scaleX = canvas.width / 1200;
    let scaleY = canvas.height / 600;
    scale = Math.min(scaleX, scaleY);
    if (scale < 0.5) scale = 0.5;

    groundY = canvas.height - (80 * scale);
    sling.x = canvas.width * 0.18;
    if (sling.x < 150) sling.x = 150;
    sling.y = groundY - (120 * scale);
    
    if (!bird.isLaunched) {
        bird.x = sling.x;
        bird.y = sling.y;
        bird.radius = 18 * scale;
    }

    const startX = canvas.width - (350 * scale);
    const boxW = 55 * scale;
    const boxH = 65 * scale;
    
    targets = [
        { x: startX, y: groundY - boxH, width: boxW, height: boxH, alive: true },
        { x: startX + boxW + (15 * scale), y: groundY - boxH, width: boxW, height: boxH, alive: true },
        { x: startX + (boxW / 2) + (7 * scale), y: groundY - (boxH * 2) - (5 * scale), width: boxW, height: boxH, alive: true }
    ];
}

function triggerStart() {
    gameState = "PLAYING";
    score = 0;
    lives = 3;
    
    resizeCanvas();
    resetBird();
    
    startScreen.classList.add("hidden");
    gameOverScreen.classList.add("hidden");
}

function getMousePos(e) {
    const rect = canvas.getBoundingClientRect();
    let clientX = e.clientX;
    let clientY = e.clientY;
    
    if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
    } else if (e.changedTouches && e.changedTouches.length > 0) {
        clientX = e.changedTouches[0].clientX;
        clientY = e.changedTouches[0].clientY;
    }
    
    return {
        x: (clientX || 0) - rect.left,
        y: (clientY || 0) - rect.top
    };
}

function startDrag(e) {
    if (gameState !== "PLAYING" || bird.isLaunched || lives <= 0) return;
    const pos = getMousePos(e);
    const dist = Math.hypot(pos.x - bird.x, pos.y - bird.y);
    if (dist < bird.radius + (30 * scale)) {
        bird.isDragging = true;
    }
}

function drag(e) {
    if (!bird.isDragging || gameState !== "PLAYING") return;
    const pos = getMousePos(e);
    
    const distX = pos.x - sling.x;
    const distY = pos.y - sling.y;
    const angle = Math.atan2(distY, distX);
    
    let maxDrag = 130 * scale;
    const dist = Math.min(Math.hypot(distX, distY), maxDrag);

    bird.x = sling.x + Math.cos(angle) * dist;
    bird.y = sling.y + Math.sin(angle) * dist;
}

function endDrag() {
    if (!bird.isDragging || gameState !== "PLAYING") return;
    bird.isDragging = false;
    bird.isLaunched = true;

    bird.vx = (sling.x - bird.x) * 0.24;
    bird.vy = (sling.y - bird.y) * 0.24;
}

canvas.addEventListener("mousedown", startDrag);
canvas.addEventListener("mousemove", drag);
window.addEventListener("mouseup", endDrag);

canvas.addEventListener("touchstart", function(e) { startDrag(e); });
canvas.addEventListener("touchmove", function(e) { drag(e); });
window.addEventListener("touchend", endDrag);

window.addEventListener("resize", () => {
    resizeCanvas();
});

function resetBird() {
    bird.x = sling.x;
    bird.y = sling.y;
    bird.vx = 0;
    bird.vy = 0;
    bird.isLaunched = false;
}

function checkCollision(b, t) {
    if (!t.alive) return false;
    let closestX = Math.max(t.x, Math.min(b.x, t.x + t.width));
    let closestY = Math.max(t.y, Math.min(b.y, t.y + t.height));
    let distance = Math.hypot(b.x - closestX, b.y - closestY);
    return distance < b.radius;
}

function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#654321";
    ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

    ctx.strokeStyle = "#4a2c11";
    ctx.lineWidth = 8 * scale;
    ctx.beginPath();
    ctx.moveTo(sling.x, sling.y);
    ctx.lineTo(sling.x, groundY);
    ctx.stroke();

    if (gameState === "PLAYING") {
        ctx.fillStyle = "#fff";
        ctx.font = "bold 24px Arial";
        ctx.textAlign = "center";
        ctx.fillText("Điểm: " + score, canvas.width / 2, 40);

        for (let i = 0; i < lives - 1; i++) {
            ctx.fillStyle = "#ff3333";
            ctx.beginPath();
            ctx.arc(sling.x - 45 - (i * 35), groundY - bird.radius, bird.radius, 0, Math.PI * 2);
            ctx.fill();
        }

        if (bird.isDragging) {
            ctx.strokeStyle = "#4a2c11";
            ctx.lineWidth = 5 * scale;
            ctx.beginPath();
            ctx.moveTo(sling.x, sling.y);
            ctx.lineTo(bird.x, bird.y);
            ctx.stroke();

            let simX = bird.x;
            let simY = bird.y;
            let simVx = (sling.x - bird.x) * 0.24;
            let simVy = (sling.y - bird.y) * 0.24;
            
            ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
            for (let i = 0; i < 30; i += 2) {
                simX += simVx * 2;
                simY += simVy * 2;
                simVy += 0.22 * 2;
                if (simY >= groundY || simX > canvas.width || simX < 0) break;
                ctx.beginPath();
                ctx.arc(simX, simY, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        if (bird.isLaunched) {
            bird.x += bird.vx;
            bird.y += bird.vy;
            bird.vy += 0.22;

            if (bird.y + bird.radius >= groundY || bird.x > canvas.width || bird.x < 0) {
                bird.isLaunched = false;
                lives--;
                
                let currentAllDead = true;
                targets.forEach(t => { if (t.alive) currentAllDead = false; });
                
                if (!currentAllDead && lives === 0) {
                    endGame(false);
                } else if (!currentAllDead) {
                    resetBird();
                }
            }
        }

        if (!bird.isLaunched && lives > 0) {
            ctx.fillStyle = "#ff3333";
            ctx.beginPath();
            ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
            ctx.fill();
        } else if (bird.isLaunched && bird.y + bird.radius < groundY) {
            ctx.fillStyle = "#ff3333";
            ctx.beginPath();
            ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
            ctx.fill();
        }

        let allDead = true;
        targets.forEach(t => {
            if (t.alive) {
                allDead = false;
                if (checkCollision(bird, t)) {
                    t.alive = false;
                    score += 100;
                }
                ctx.fillStyle = "#8ddb44";
                ctx.fillRect(t.x, t.y, t.width, t.height);
                ctx.strokeStyle = "#558822";
ctx.lineWidth = 2 * scale;
ctx.strokeRect(t.x, t.y, t.width, t.height);
}
});
if (allDead && targets.length > 0) {
endGame(true);
}
} else {
ctx.fillStyle = "#ff3333";
ctx.beginPath();
ctx.arc(sling.x, sling.y, bird.radius, 0, Math.PI * 2);
ctx.fill();
}
requestAnimationFrame(update);
}
resizeCanvas();
update();
